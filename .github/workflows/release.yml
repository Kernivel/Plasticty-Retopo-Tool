# Build the installable addon zip and attach it to a GitHub release.
#
# Push a tag to cut a release:
#
#     git tag v0.57.0 && git push origin v0.57.0
#
# The tag is only the trigger -- the version in the zip's name comes from
# `version.py`, and `scripts/build_zip.py` refuses to build when that and
# `bl_info["version"]` disagree. The job checks the tag matches too, so a tag
# typed a digit wrong fails here rather than shipping a mislabelled asset.
#
# Also runnable by hand (workflow_dispatch) to get the zip without a release,
# which is what you want when testing the drag-and-drop install itself.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # creating the release and uploading its asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # what Blender 4.2+ ships

      # The addon's own scripts are stdlib-only, so there is nothing to install.
      - name: Check the two version literals agree
        run: python scripts/build_zip.py --check

      - name: Check the tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(python -c "import re,sys; print(re.search(r'ADDON_VERSION\s*=\s*\"([^\"]*)\"', open('version.py').read()).group(1))")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match version.py ($declared)" >&2
            exit 1
          fi

      - name: Build
        run: python scripts/build_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Install:** download the `.zip` below and drag it into Blender,
            or use Edit > Preferences > Add-ons > Install from Disk.

            Requires Blender 4.2 or newer. Plasticity itself is not needed to
            run the addon, only to produce the meshes it works on (imported
            through the plasticity-blender-addon bridge).
