# Build the MkDocs site and publish it to GitHub Pages.
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source = "GitHub Actions". No gh-pages branch is needed with this workflow.
name: Documentation

on:
  push:
    branches: [main]
    # The addon's own code never changes the site, so don't rebuild for it.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  # So a broken docs change fails in the PR rather than on main.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict turns a dead internal link into a failed build, which is the
      # only thing that keeps a docs site honest as pages get renamed.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # A pull request builds to prove it still compiles; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
